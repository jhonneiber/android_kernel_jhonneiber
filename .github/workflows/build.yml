name: Build Jhonneiber Kernel GKI

on:
  push:
    branches: [ "main", "android12-5.10" ]
  workflow_dispatch:

jobs:
  build_kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3

      - name: Install Build Essentials
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm-dev libncurses-dev crossbuild-essential-arm64

      - name: Build Kernel Image
        run: |
          export ARCH=arm64
          export LLVM=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          make gki_defconfig
          make -j$(nproc) Image

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v3
        with:
          name: Jhonneiber-Kernel-Image
          path: arch/arm64/boot/Image
