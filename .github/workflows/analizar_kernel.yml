name: Laboratorio de Ingenieria Inversa del Kernel

on:
  workflow_dispatch: 

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  analizar-binario:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar únicamente el archivo kernel
      uses: actions/checkout@v4
      with:
        sparse-checkout: |
          kernel_descomprimido
        sparse-checkout-cone-mode: false

    - name: Instalar QEMU, GDB y Python
      run: |
        sudo apt-get update
        sudo apt-get install -y qemu-system-arm gdb-multiarch python3

    - name: Descargar y Desempaquetar el DTB Real del Infinix
      run: |
        # 1. Descargamos el dtb.img original de tu repositorio
        curl -L -o dtb.img https://github.com/thequantumcog/device_infinix_X6831/raw/12.1/prebuilt/dtb.img
        
        # 2. Script en Python para extraer el primer DTB puro usando su firma mágica (0xd00dfeed)
        python3 -c "
        import struct
        
        with open('dtb.img', 'rb') as f:
            data = f.read()
            
        # Buscamos los bytes mágicos del árbol de dispositivos en Big-Endian
        magic = b'\xd0\x0d\xfe\xed'
        offset = data.find(magic)
        
        if offset == -1:
            print('¡ERROR: No se encontró la firma mágica DTB!')
            exit(1)
            
        # Leemos el tamaño total del DTB (guardado en los bytes 4 a 8 de la cabecera)
        dtb_size = struct.unpack('>I', data[offset+4:offset+8])[0]
        print(f'DTB encontrado en el offset {offset} con un tamaño de {dtb_size} bytes.')
        
        # Guardamos limpiamente solo el fragmento del DTB puro
        with open('infinix.dtb', 'wb') as out:
            out.write(data[offset:offset+dtb_size])
        print('¡Archivo infinix.dtb extraído con éxito para QEMU!')
        "

    - name: Iniciar QEMU con el DTB Limpio
      run: |
        qemu-system-aarch64 -M virt -cpu cortex-a57 -kernel ./kernel_descomprimido -dtb ./infinix.dtb -nographic -s -S > qemu_output.log 2>&1 &
        sleep 2 

    - name: Crear script de traducción para GDB
      run: |
        cat << 'EOF' > gdb_commands.txt
        target remote :1234
        set architecture aarch64
        
        # Ponemos el breakpoint justo en la fase de control post-MMU
        break *0x4105c3bc
        
        continue
        
        echo \n--- ¡MMU ACTIVADA CON DTB DEL INFINIX X6831! ---\n
        x/20i $pc
        
        echo \n--- REGISTROS POST-MMU ---\n
        info registers
        quit
        EOF

    - name: Ejecutar GDB y extraer el volcado de memoria
      run: |
        gdb-multiarch -batch -x gdb_commands.txt > resultado_memoria.txt

    - name: Guardar los resultados como un archivo descargable
      uses: actions/upload-artifact@v4
      if: always() # <--- Regla de oro: Guarda los reportes aunque falle el paso anterior
      with:
        name: reporte-analisis-kernel
        path: |
          resultado_memoria.txt
          qemu_output.log
